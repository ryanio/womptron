name: Tweet new womps

# Runs one pass every 15 minutes instead of holding a resident process.
#
# womptron keeps no state between runs. Dedupe is purely temporal: each pass
# tweets womps created in the last WOMPTRON_INTERVAL seconds. That is why the
# interval below MUST match the cron period (15 minutes = 900 seconds). Set it
# too low and womps fall through the gap between runs; too high and consecutive
# runs overlap and re-tweet, and every duplicate is a billed request.
#
# GitHub's scheduler is best effort and can run late under load. A late run is
# harmless (the window is measured from the moment the run starts, so it still
# looks back 900 seconds), but two runs firing close together would overlap, so
# concurrency below prevents that.

on:
  schedule:
    # Every 15 minutes. Voxels currently produces about 1.2 womps a day, so this
    # is far more often than needed; it exists to keep latency low rather than
    # to keep up with volume.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and log without tweeting"
        type: boolean
        default: true

permissions:
  contents: read

# Never let two passes overlap. Overlapping runs would re-tweet the same womps,
# since neither knows what the other posted.
concurrency:
  group: womptron-tweet
  cancel-in-progress: false

jobs:
  tweet:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Tweet new womps
        env:
          TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
          TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          WOMPTRON_RUN_ONCE: "true"
          # Must equal the cron period above, in seconds.
          WOMPTRON_INTERVAL: "900"
          # A post containing a URL bills at $0.200 instead of $0.015.
          WOMPTRON_INCLUDE_URL: "false"
          # Ceiling per run, so a Voxels backfill cannot bill an unbounded burst.
          WOMPTRON_MAX_TWEETS_PER_RUN: "5"
          LOG_LEVEL: INFO
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Dry run: skipping the tweet step."
            echo "Nothing was posted." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          yarn start
